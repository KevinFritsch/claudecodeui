<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b2b"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </linearGradient>
    <radialGradient id="glowIris" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c77f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c77f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b9b6ff"/>
      <stop offset="0.55" stop-color="#8b86f6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="eyes">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="194" y="236" width="38" height="84" rx="19" fill="#000"/>
      <rect x="280" y="236" width="38" height="84" rx="19" fill="#000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#tile)"/>
  <rect width="512" height="512" rx="0" fill="url(#glowIris)"/>
  <rect width="512" height="512" rx="0" fill="url(#glowMint)"/>
  
  <g filter="url(#soft)">
    <circle cx="256" cy="116" r="28" fill="url(#mark)"/>
    <g mask="url(#eyes)">
      <rect x="112" y="172" width="288" height="216" rx="96" fill="url(#mark)"/>
      <rect x="112" y="172" width="288" height="216" rx="96" fill="url(#sheen)"/>
    </g>
  </g>
</svg>